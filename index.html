<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توكتوكي - جرجا</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #FFD700; --dark: #1a1a1a; --light: #f8f9fa; --danger: #dc3545; --success: #28a745; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f6f9; color: #333; padding-bottom: 30px; }
        header { background: var(--dark); color: var(--primary); text-align: center; padding: 15px; font-size: 24px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .container { max-width: 600px; margin: 15px auto; padding: 0 15px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .card h2 { font-size: 18px; margin-bottom: 15px; color: var(--dark); border-bottom: 2px solid var(--primary); padding-bottom: 5px; }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; }
        button { background: var(--primary); color: var(--dark); font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .hidden { display: none; }
        .driver-item { border: 1px solid #eee; padding: 12px; border-radius: 8px; margin-bottom: 10px; background: #fff; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; }
        .badge-active { background: var(--success); }
        .badge-inactive { background: var(--danger); }
        .alert { padding: 10px; border-radius: 6px; font-size: 14px; margin-bottom: 10px; display: none; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-danger { background: #f8d7da; color: #721c24; }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body>

<header><i class="fa-solid fa-taxi"></i> توكتوكي - جرجا</header>

<div class="container">
    <div id="alertBox" class="alert"></div>

    <!-- واجهة المستخدمين والسائقين -->
    <div id="publicView">
        <div class="card">
            <h2><i class="fa-solid fa-id-card"></i> تسجيل سائق جديد</h2>
            <form id="driverForm">
                <input type="text" id="driverName" placeholder="الاسم بالكامل" required>
                <input type="tel" id="driverPhone" placeholder="رقم الهاتف (واتساب)" required>
                <input type="text" id="driverArea" placeholder="المنطقة / القرية (مثال: المزاتة، الشيخ جبر)" required>
                <button type="submit"><i class="fa-solid fa-paper-plane"></i> إرسال طلب التسجيل</button>
            </form>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-magnifying-glass"></i> الاستعلام عن حالة الحساب</h2>
            <input type="tel" id="searchPhone" placeholder="أدخل رقم هاتفك">
            <button onclick="checkStatus()"><i class="fa-solid fa-search"></i> بحث</button>
            <div id="statusResult" style="margin-top:10px;"></div>
        </div>
    </div>

    <!-- لوحة التحكم للأدمن -->
    <div id="adminView" class="hidden">
        <div class="card" style="background:#fff3cd;">
            <h2><i class="fa-solid fa-user-shield"></i> لوحة الإدارة</h2>
            <button onclick="loadDrivers()"><i class="fa-solid fa-rotate"></i> تحديث القائمة</button>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-clock"></i> طلبات جديدة (في الانتظار)</h2>
            <div id="pendingList">جاري التحميل...</div>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-check-circle"></i> السائقون المعتمدون</h2>
            <div id="activeList">جاري التحميل...</div>
        </div>
    </div>
</div>

<script>
    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSyDummyKey",
        authDomain: "toktoki-dfb23.firebaseapp.com",
        projectId: "toktoki-dfb23",
        storageBucket: "toktoki-dfb23.appspot.com",
        messagingSenderId: "100000000",
        appId: "1:100000000:web:00000000"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // التحقق من وضع الأدمن بواسطة #28052003 في الرابط
    const isAdmin = window.location.hash === '#28052003';
    if (isAdmin) {
        document.getElementById('publicView').classList.add('hidden');
        document.getElementById('adminView').classList.remove('hidden');
        loadDrivers();
    }

    function showAlert(msg, isSuccess = true) {
        const box = document.getElementById('alertBox');
        box.className = `alert ${isSuccess ? 'alert-success' : 'alert-danger'}`;
        box.innerText = msg;
        box.style.display = 'block';
        setTimeout(() => box.style.display = 'none', 4000);
    }

    // تسجيل سائق جديد
    document.getElementById('driverForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('driverName').value.trim();
        const phone = document.getElementById('driverPhone').value.trim();
        const area = document.getElementById('driverArea').value.trim();

        try {
            await db.collection('drivers').doc(phone).set({
                name: name,
                phone: phone,
                area: area,
                status: 'pending',
                createdAt: new Date()
            });
            showAlert('تم إرسال طلبك بنجاح! سيتم مراجعته وتفعيله قريباً.');
            document.getElementById('driverForm').reset();
        } catch (err) {
            showAlert('حدث خطأ أثناء الإرسال: ' + err.message, false);
        }
    });

    // استعلام السائق عن حالته
    async function checkStatus() {
        const phone = document.getElementById('searchPhone').value.trim();
        const resDiv = document.getElementById('statusResult');
        if (!phone) return;

        try {
            const doc = await db.collection('drivers').doc(phone).get();
            if (!doc.exists) {
                resDiv.innerHTML = '<span style="color:red;">الرقم غير مسجل لديّنا.</span>';
                return;
            }
            const data = doc.data();
            if (data.status === 'active') {
                resDiv.innerHTML = `<span class="badge badge-active">حسابك مفعل ومقبول ✔</span><br><br>الاسم: ${data.name}<br>المنطقة: ${data.area}`;
            } else {
                resDiv.innerHTML = `<span class="badge badge-inactive">طلبك قيد المراجعة ⏳</span>`;
            }
        } catch (err) {
            resDiv.innerHTML = 'خطأ في الاستعلام: ' + err.message;
        }
    }

    // تحميل السائقين للأدمن
    async function loadDrivers() {
        const pendingDiv = document.getElementById('pendingList');
        const activeDiv = document.getElementById('activeList');
        pendingDiv.innerHTML = 'جاري التحميل...';
        activeDiv.innerHTML = 'جاري التحميل...';

        try {
            const snapshot = await db.collection('drivers').get();
            let pendingHTML = '';
            let activeHTML = '';

            snapshot.forEach(doc => {
                const d = doc.data();
                const card = `
                    <div class="driver-item">
                        <strong>${d.name}</strong> (${d.area})<br>
                        <small>📱 ${d.phone}</small><br><br>
                        ${d.status === 'pending' 
                            ? `<button class="btn-success" onclick="updateStatus('${d.phone}', 'active')">✔ تفعيل الحساب</button>`
                            : `<button class="btn-danger" onclick="updateStatus('${d.phone}', 'pending')">إيقاف الحساب</button>`}
                    </div>
                `;
                if (d.status === 'pending') pendingHTML += card;
                else activeHTML += card;
            });

            pendingDiv.innerHTML = pendingHTML || '<p>لا توجد طلبات معلقة.</p>';
            activeDiv.innerHTML = activeHTML || '<p>لا يوجد سائقون معتمدون حالياً.</p>';
        } catch (err) {
            showAlert('خطأ أثناء تحميل البيانات: ' + err.message, false);
        }
    }

    // تغيير حالة السائق من الأدمن
    async function updateStatus(phone, newStatus) {
        try {
            await db.collection('drivers').doc(phone).update({ status: newStatus });
            showAlert('تم تحديث حالة السائق بنجاح');
            loadDrivers();
        } catch (err) {
            showAlert('خطأ في التحديث: ' + err.message, false);
        }
    }
</script>
</body>
</html>
